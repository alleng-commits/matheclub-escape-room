<!doctype html><html lang="de"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Matheclub – Vier Schlüssel</title><style>body{font-family:system-ui;background:#f3f7fd;color:#17304b;max-width:900px;margin:auto;padding:24px}h1{color:#164c77}.room{background:white;border-radius:18px;padding:22px;margin:18px 0;box-shadow:0 3px 14px #d5deec}.btn{display:inline-block;background:#164c77;color:white;padding:10px 14px;border-radius:10px;margin:5px;text-decoration:none}small{color:#576879}input{padding:10px;border-radius:8px;border:1px solid #ccc}button{padding:10px;background:#f3bd42;border:0;border-radius:8px;cursor:pointer}</style><h1>🔐 Matheclub: Die vier Schlüssel</h1><p>Vier Räume · zwölf Missionen · vier Gelingenachweise. Löse die Aufgaben, erkläre deine Rechenwege und sammle alle Schlüssel!</p><p><strong>Dein Forschername:</strong> <input id="name" placeholder="Vorname"></p><div id="rooms"></div><p><a class="btn" href="Lehrkraft_Plan_und_Videos.pdf">📘 Lehrkraft-Plan</a></p><script>const data=[{"name": "Addition", "color": "blau", "words": ["Summand", "Summe", "Einer", "Zehner", "Hunderter", "Übertrag"]}, {"name": "Subtraktion", "color": "grün", "words": ["Minuend", "Subtrahend", "Differenz", "ergänzen", "Übertrag", "Stellenwert"]}, {"name": "Multiplikation", "color": "orange", "words": ["Faktor", "Produkt", "zerlegen", "Zehner", "Einer", "Teilprodukt"]}, {"name": "Division", "color": "lila", "words": ["Dividend", "Divisor", "Quotient", "zerlegen", "Teilaufgabe", "Probe"]}];const videos=['https://www.youtube.com/watch?v=R1zmiQJqOJ4','https://youtu.be/U7H76rpe1p8','https://www.youtube.com/watch?v=kPW8g3-UFdE','https://oer-bsce.uni.lu/2020/06/10/die-halbschriftliche-division/'];let root=document.getElementById('rooms');data.forEach((r,i)=>{let k=i+1;root.innerHTML+=`<section class="room"><h2>🚪 Raum ${k}: ${r.name}</h2><p>🔑 ${r.color}er Schlüssel</p><p><strong>Wortspeicher:</strong> ${r.words.join(' · ')}</p><a class="btn" href="Raum_${k}_${r.name}_Arbeitsblatt.pdf">✏️ Arbeitsblatt</a><a class="btn" href="Raum_${k}_${r.name}_Gelingenachweis.pdf">🧩 Gelingenachweis</a><a class="btn" href="Raum_${k}_${r.name}_Urkunde.pdf">🏅 Urkunde + Schlüssel</a><a class="btn" target="_blank" rel="noopener" href="${videos[i]}">▶ Erklärvideo</a><p><small>Der Schlüssel wird nach der Prüfung durch die Lehrkraft vergeben.</small></p></section>`});</script></html>
